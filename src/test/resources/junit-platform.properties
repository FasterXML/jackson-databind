# Execute test classes & methods in a random order to ensure there are no accidental dependencies
# between test classes & methods
# See: https://junit.org/junit5/docs/current/user-guide/#writing-tests-test-execution-order
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
# Reproducing failures
#junit.jupiter.execution.order.random.seed=<seed for method order>
#junit.jupiter.execution.class.order.random.seed=<seed for class order>
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=200